!DOCTYPE html>
<html>
<head>
    <title>AI Customer Support Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2 style="text-align:center;">Customer Support Chatbot</h2>
    <div id="chatbox"></div>
    <input id="userInput" type="text" placeholder="Type your message..." />
    <button onclick="send()">Send</button>

    <script>
        function send() {
            let msg = document.getElementById("userInput").value;
            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += "<div class='user'>" + msg + "</div>";

            fetch("/get", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "msg=" + msg
            })
            .then(response => response.text())
            .then(data => {
                chatbox.innerHTML += "<div class='bot'>" + data + "</div>";
            });
        }
    </script>
</body>
</html>
